# Gen-2 build gate (task 0a deliverable 4): runs `make gen2-check` — the
# module-boundary graph (gen2/boundaries.toml), schema/DDL validation and the
# gen-2 tests. Any failure fails the build.
name: gen2-check

on:
  push:
  pull_request:

jobs:
  gen2-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gen-2 runtime dependencies (hash-locked)
        run: python -m pip install --require-hashes -r gen2/requirements.txt
      - name: Install dev-only schema validator
        run: python -m pip install -r gen2/requirements-dev.txt
      - name: make gen2-check
        run: make gen2-check PYTHON=python
