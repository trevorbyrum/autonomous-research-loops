# Gen-2 build gate (task 0a deliverable 4): runs `make gen2-check` — the
# module-boundary graph (gen2/boundaries.toml), schema/DDL validation and the
# gen-2 tests. Any failure fails the build.
name: gen2-check

on:
  push:
  pull_request:

jobs:
  gen2-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The same project-isolated environment a local build uses: a venv built
      # from the hash-locked requirements (--require-hashes --no-deps), and
      # every check run with its interpreter (docs/gen2/ENVIRONMENT.md).
      - name: Build the gen-2 environment (hash-locked venv)
        run: make gen2-venv PYTHON_BOOTSTRAP=python
      # Records the SQLite this job actually runs on (version, JSON probes,
      # connection pragmas) in the job summary, and refuses the build if the
      # store's compatibility gate would refuse it (Astra third review ruling 4).
      # No pipe: make's exit status is the step's.
      - name: SQLite compatibility gate (records the version CI runs on)
        run: make gen2-sqlite PYTHON_BOOTSTRAP=python GEN2_SQLITE_REPORT="$GITHUB_STEP_SUMMARY"
      - name: make gen2-check
        run: make gen2-check PYTHON_BOOTSTRAP=python
