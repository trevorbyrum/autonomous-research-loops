master_process off;
daemon off;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 64; }
http {
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    client_header_timeout 2s;
    client_body_timeout 2s;
    send_timeout 2s;
    keepalive_timeout 0;
    map "$request_method:$request_uri:$server_protocol" $route {
        default denied;
        "POST:/v1/responses:HTTP/1.1" model;
    }
    log_format exchange escape=json '{"v":3,"id":"$request_id","src":"$remote_addr",'
        '"port":"$remote_port","conn":"$connection","ordinal":"$connection_requests",'
        '"listener":"$server_name","server_port":"$server_port","method":"$request_method",'
        '"route":"$route","upstream":"$upstream_addr","status":"$status",'
        '"upstream_status":"$upstream_status","complete":"$request_completion","at":"$msec"}';
    access_log /evidence/access.jsonl exchange;
    server {
        listen 172.31.254.2:8080;
        server_name model;
        location = /v1/responses {
            if ($route != model) { return 403; }
            proxy_pass http://172.31.252.3:8081/v1/responses;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host "172.31.252.3:8081";
            proxy_set_header Content-Type application/json;
            proxy_set_header Accept text/event-stream;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            proxy_set_header Upgrade "";
            proxy_next_upstream off;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 35s;
            proxy_send_timeout 2s;
        }
        location / { return 403; }
    }
}
