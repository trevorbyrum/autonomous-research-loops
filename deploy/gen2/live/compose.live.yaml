services:
  engine:
    environment:
      GEN2_GATEWAY_URL: http://172.31.250.3:8765
      GEN2_SECRET_GATEWAY_TOKEN_FILE: /etc/gen2/discovery-token
      GEN2_QUALIFICATION_RECORD: /etc/gen2/qualification-record.json
      GEN2_QUALIFICATION_PIN: ${GEN2_QUALIFICATION_PIN:?operator's independent record-byte pin}
      GEN2_MANIFEST: /etc/gen2/manifest.json
    volumes:
      - ${GEN2_CONFIG_ROOT:?configuration root}/prompts:/opt/gen2/gen2/prompts:ro
      - ${GEN2_CONFIG_ROOT:?configuration root}/secrets/discovery-token:/etc/gen2/discovery-token:ro
      - ${GEN2_CONFIG_ROOT:?configuration root}/qualification-record.json:/etc/gen2/qualification-record.json:ro
      - ${GEN2_CONFIG_ROOT:?configuration root}/deployment-manifest.json:/etc/gen2/manifest.json:ro
