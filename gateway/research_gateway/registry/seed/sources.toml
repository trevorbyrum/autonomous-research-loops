# Research gateway source registry — the public source of truth (PLAN.md §3).
#
# Field reference
#   kind            article | dataset | citation | resolver | statistical | manual
#   capabilities    subset of find, resolve, enrich, fetch, data
#   base_for        kinds this source is a BASE lane for (queried for every request of that kind)
#   domains         domain tags that ADD this lane (finance, market, social, management, ai-ml,
#                   software, biomed); "other" always includes every domain lane (D-12)
#   auth            none | email | key | optional_token | client_credentials | username_key | account
#   secret_ref      logical name only; the deployment maps it to an env var or a secrets backend
#   use_commercial  allow | per-item | deny | unknown  (personal research use is the baseline, D-5)
#   rate.verified   false until the limit is confirmed from headers/docs in Phase 3; unverified
#                   sources stay enabled = false (PLAN.md §3)
# Every limit and verdict cites where it was read. Nothing here is from memory.

# ---------------------------------------------------------------- article indexes

