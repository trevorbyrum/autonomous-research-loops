[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-loops"
version = "0.1.0"
description = "A durable engine for running autonomous research topics to genuine, executable completion."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = []

[project.scripts]
research-loops = "research_loops.__main__:main"

[tool.setuptools.packages.find]
include = ["research_loops*"]
