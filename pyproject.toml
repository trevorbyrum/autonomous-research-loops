[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-loops"
version = "0.1.0"
description = "A durable engine for running autonomous research topics to genuine, executable completion."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# The MCP server (research_loops/mcp_server.py) is the engine's only
# optional dependency; the core stays dependency-free without it.
mcp = ["mcp>=2"]

[project.scripts]
research-loops = "research_loops.__main__:main"
research-loops-mcp = "research_loops.mcp_server:main"

[tool.setuptools.packages.find]
include = ["research_loops*"]

[tool.setuptools.package-data]
# chassis/, runners/, templates/, and schema/ live inside the research_loops
# package specifically so a real (non-editable) `pip install .`/wheel ships
# them too -- setuptools only includes .py files by default, so this is
# required in addition to the directories physically living under
# research_loops/, not a substitute for it. These are subprocess-invoked
# shell scripts and reference markdown/JSON, not importable Python, which is
# why they're package-data rather than their own subpackages. Explicit
# extensions rather than a "**" glob so a stray __pycache__/*.pyc (created
# whenever chassis/gap-policy.py dynamically loads semantic-state.py as a
# module) can never get swept into a build by accident.
research_loops = [
    "chassis/*.sh",
    "chassis/*.py",
    "chassis/*.md",
    "runners/*.sh",
    "runners/*.md",
    "templates/topic/*.md",
    "templates/topic/*.example",
    "schema/*.json",
]
