# Declarative scheduling / agent-assignment / gap-policy config.
#
# This is convenience over the same primitives the CLI already exposes:
#   research-loops workers start --config this-file.toml
#   research-loops config apply  --config this-file.toml
#   research-loops config show   --config this-file.toml <topic-id>
#
# It never replaces `research-loops add`/`sync` — those still own each
# item's title/cwd/command/depends_on. Copy this file, edit it, and point
# the commands above at your copy. See docs/operations.md#declarative-config.

# How many parallel `run --worker` processes `workers start` spawns.
# Each is fully independent (its own lock file, its own claimed item) —
# this is the same thing as starting N systemd units by hand (see
# deploy/systemd/), just from one config number.
workers = 1

# How often an idle worker checks the queue for newly-eligible work, and how
# long it sleeps between empty polls. Distinct from a topic's repeat_seconds
# below, which paces a single item's own retry/backoff cadence.
poll_seconds = 1.0
idle_sleep = 5.0

# Fallback settings for any topic under [topics.*] below that doesn't
# override a given key. Omit a key entirely to use the engine's own default
# (see `research-loops add --help`).
[defaults]
# Minimum seconds between the end of one iteration and the start of the next
# for a given topic (a repeating topic never runs back-to-back with no gap).
repeat_seconds = 900
# How many consecutive failures before an item is flagged needs_attention
# instead of retried again.
max_attempts = 8

# gap_policy controls what an agent does when it finds a real research gap
# not covered by any existing obligation:
#   "review" (default) — the agent may only propose it (a PROPOSAL row in
#     DECISIONS-LOG.md); an operator promotes it by hand or with
#     `research_loops/chassis/gap-policy.py promote`. This is the engine's default and
#     matches docs/governance.md#the-operator-owns-scope.
#   "auto" — the agent may self-promote a gap directly into a binding
#     obligation (research_loops/chassis/gap-policy.py promote --auto), up to
#     gap_auto_limit times since the operator's last review-reset. Every
#     self-promotion is tagged AUTO-PROMOTED in DECISIONS-LOG.md and fully
#     auditable; once the limit is hit the agent falls back to proposing
#     only, until you run:
#       research_loops/chassis/gap-policy.py review-reset topics/<id> --note "..."
gap_policy = "review"
gap_auto_limit = 0

# Per-topic overrides. Only topics named here are touched by
# `config apply` — it never silently reconfigures a queue item that isn't
# listed under [topics.*].
[topics.example-topic]
# Optional: argv run exactly once when this topic lands completed (e.g. index the
# finished corpus into your own store). Ledgered on failure, never un-completes.
# on_completed_command = ["/home/you/bin/my-corpus-ingest"]
repeat_seconds = 600
max_attempts = 5

# agent_main sets RESEARCH_LOOP_RUNNER for this item, i.e. which runners/*
# adapter actually runs the iteration (claude, codex, hermes, generic, or
# your own) — overriding whatever runner name the item's command was
# originally queued with.
agent_main = "claude"

# agent_secondary names a second agent the primary one may delegate
# independent, well-scoped legwork to (discovery/extraction only, per
# CONTRACT-CORE.md step 4 — it never gets final judgment). Surfaced to the
# runner as RESEARCH_LOOP_AGENT_SECONDARY and folded into the iteration
# prompt; what delegation actually looks like depends on the primary
# runner/CLI you chose above.
agent_secondary = "codex"

# This topic is allowed to self-promote up to 3 real gaps before an operator
# has to look at it.
gap_policy = "auto"
gap_auto_limit = 3

# internal_citations lets this topic cite a source already vetted in another
# topic (`## [SRC-NNN] internal` in SOURCE-LEDGER.md, see docs/citations.md)
# instead of re-researching it. Disabled by default, portfolio-wide and per
# topic -- set true in [defaults] to enable everywhere, or per topic like here.
internal_citations = true

# topic_refresh controls whether a COMPLETED topic automatically comes back
# to check for new information: "off" (default, portfolio-wide and per
# topic) -- never automatic, use `research-loops refresh <id>` by hand;
# "weekly" / "monthly" -- automatically requeued that often once completed.
topic_refresh = "monthly"
# topic_refresh_mode controls how much gets reopened each time a refresh
# fires: "light" (one new check obligation only), "continue" (default --
# reopens previously-supported obligations), "full" (reopens everything).
# See docs/operations.md#topic_refresh.
topic_refresh_mode = "continue"

[lanes]
# Max concurrent discovery passes on the intake lane. Deliberately 1 by
# default: a pile of broad-mode drafts queues its discovery runs one at a
# time — raise this only on purpose.
intake_max_active = 1
